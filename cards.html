<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card design</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>
    <div class="card">
        <img class="image" src="/061ae356-6a14-4aa5-b57c-9dcc6f71db03.png" alt="open the image">
        <h1 class="heading">Water bottle</h1>
        <del class="font">$99</del>
        <ins class="bond">$49</ins><br><br>
        <button class="btn"> <i class="fa-solid fa-cart-shopping"></i> add to card</button>

    </div>
    <div class="card-2">
        <img class="image-2" src="/water bottle-2.png" alt="open the image">
        <h1 class="heading-2">Water bottle</h1>
        <del class="delete-2">$99</del>
        <ins class="insert-2">$49</ins><br><br>
        <button class="btn-2"><i class="fa-solid fa-cart-shopping"></i> add to card</button>
    </div>
    <div class="card-3">
        <img class="image-3" src="/2f1f9a66-fd75-40b0-b2e2-427236bd687c.png" alt="open the image">

        <h1 class="heading-3">Water bottle</h1>

        <del class="delt-3">$99</del>
        <ins class="insert-3">$49</ins><br><br>
        <button class="btn-3"> <i class="fa-solid fa-cart-shopping"></i> add to card</button>
    </div>
</body>

</html>
